<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>AI Sales Assistant</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/style.css') }}"
    >
</head>

<body>

    <div class="chat-container">

        <header class="chat-header">
            <h1>AI Sales Assistant</h1>
            <p>Ask about products, availability, policies, or orders.</p>
        </header>

        <main id="chat-messages" class="chat-messages">

            <div class="message assistant">
                <div class="message-content">
                    Hello! How can I help you today?
                </div>
            </div>

        </main>

        <form id="chat-form" class="chat-input-area">

            <input
                type="text"
                id="message-input"
                placeholder="Ask me something..."
                autocomplete="off"
            >

            <!-- Attach File Button (Images & Audios) -->
            <label for="media-input" class="media-attach-btn" title="Attach an image or audio file">
                📎 <span class="attach-label">Attach</span>
            </label>
            <input 
                type="file" 
                id="media-input" 
                accept="image/*,audio/*,.jpg,.jpeg,.png,.webp,.gif,.mp3,.wav,.ogg,.webm,.m4a"
                style="display: none;"
            >

            <!-- Microphone Button for Voice Recording -->
            <button type="button" id="record-btn" class="record-btn" title="Record voice audio">
                🎙️ <span id="record-btn-text">Record</span>
            </button>

            <button type="submit" id="send-button">
                Send
            </button>

        </form>

        <!-- Preview Tray for Selected or Recorded Media -->
        <div id="media-preview-tray" class="media-preview-tray" style="display: none;">
            <span id="preview-filename"></span>
            <audio id="preview-audio" controls style="display: none; height: 30px;"></audio>
            <button type="button" id="clear-media-btn" title="Remove attachment">✕</button>
        </div>

    </div>

    <script src="{{ url_for('static', filename='js/chat.js') }}"></script>

</body>
</html>
